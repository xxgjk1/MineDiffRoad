[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minediffroad"
version = "0.2.0"
description = "Source implementation of reliability-controlled conservative-label road segmentation"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10,<13", "PyYAML>=6,<7", "addict==2.4.0"]

[project.scripts]
minediffroad = "minediffroad.__main__:main"

[tool.setuptools.packages.find]
include = ["minediffroad*"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/*LICENSE*"]
